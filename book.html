<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skywin Tour & Travels – Company Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2a4a; --teal:#0e8f8c; --gold:#c9973b; --coral:#e0553a; --paper:#fbf6ea;
  --W:440px; --H:607px; --u:13px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:#7fd0f0}
body{user-select:none;-webkit-user-select:none}

/* ============ LANDING BACKGROUND (travel theme) ============ */
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#4fb6ea 0%,#9ad8f5 45%,#ffe9c2 85%,#ffd49a 100%);overflow:hidden}
.sun{position:absolute;right:8%;top:9%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0%,#ffe27a 45%,rgba(255,226,122,0) 70%);animation:sunpulse 5s ease-in-out infinite}
@keyframes sunpulse{50%{transform:scale(1.18);opacity:.85}}
.cloud{position:absolute;width:150px;height:46px;background:#fff;border-radius:50px;opacity:.9;filter:drop-shadow(0 6px 8px rgba(0,0,0,.06));animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:62px;height:62px;top:-28px;left:22px}
.cloud::after{width:48px;height:48px;top:-18px;left:78px}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 260px))}}
.c1{top:12%;animation-duration:60s}
.c2{top:26%;transform:scale(.7);animation-duration:85s;animation-delay:-30s}
.c3{top:5%;transform:scale(.5);animation-duration:110s;animation-delay:-70s}
.c4{top:40%;transform:scale(.9);animation-duration:75s;animation-delay:-10s;opacity:.7}
.flyplane{position:absolute;left:0;top:0;width:46px;animation:fly 16s linear infinite}
.flyplane svg{width:100%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.flytrail{position:absolute;left:0;top:0;height:3px;width:220px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));border-radius:3px;animation:fly 16s linear infinite;transform-origin:right center}
@keyframes fly{
  0%{transform:translate(-12vw,70vh) rotate(-18deg)}
  100%{transform:translate(110vw,8vh) rotate(-18deg)}
}
.flytrail{animation-name:flytrail}
@keyframes flytrail{
  0%{transform:translate(-30vw,70.6vh) rotate(-18deg)}
  100%{transform:translate(92vw,8.6vh) rotate(-18deg)}
}
.balloon{position:absolute;bottom:14%;left:7%;width:90px;animation:bob 6s ease-in-out infinite}
.balloon.b2{left:auto;right:6%;bottom:30%;width:60px;animation-delay:-3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-26px) rotate(3deg)}}
.sparkle{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite;box-shadow:0 0 10px #fff}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:90px}
.waves svg{position:absolute;bottom:0;width:200%;height:100%;animation:wv 12s linear infinite}
.waves svg:nth-child(2){animation-duration:18s;animation-direction:reverse;opacity:.7;bottom:-8px}
@keyframes wv{to{transform:translateX(-50%)}}
.compass{position:absolute;left:2.5%;top:14%;width:86px;height:86px;opacity:.9}
.compass .ring{animation:spin 40s linear infinite;transform-origin:50% 50%}
.compass .needle{animation:swing 4s ease-in-out infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swing{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}

/* header + hint */
.brandbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;z-index:900;color:#0b2a4a}
.brandbar b{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:.14em}
.brandbar b i{font-style:normal;color:var(--gold)}
.brandbar span{font-size:12px;letter-spacing:.2em;font-weight:500;opacity:.8}
.hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:900;background:rgba(255,255,255,.88);padding:8px 18px;border-radius:30px;font-size:13px;color:#0b2a4a;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:hintb 2s ease-in-out infinite;transition:opacity .4s;white-space:nowrap}
@keyframes hintb{50%{transform:translateX(-50%) translateY(-6px)}}
.hint.hide{opacity:0;pointer-events:none}

/* ============ BOOK ============ */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2600px;padding-bottom:50px}
.book{position:relative;width:calc(var(--W)*2);height:var(--H);transform-style:preserve-3d;transition:transform 1s cubic-bezier(.65,.05,.35,1)}
.mobile .book{width:var(--W)}
.book.closed{transform:translateX(calc(var(--W) * -.5))}
.mobile .book.closed{transform:none}
.book.closed{animation:none}
.book.closed .leaf[data-i="0"]{animation:bookfloat 4s ease-in-out infinite}
@keyframes bookfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.book.closed .leaf[data-i="0"]:hover{animation:none;transform:rotateY(-24deg) translateY(-6px);cursor:pointer}
.book.closed .leaf[data-i="0"]:hover .cover{box-shadow:0 0 0 2px rgba(255,255,255,.4),0 0 60px rgba(255,214,120,.8),0 30px 60px rgba(0,0,0,.45)}

.stack{position:absolute;top:3px;height:calc(var(--H) - 6px);width:var(--W);background:#efe6cf;box-shadow:3px 2px 0 #ddd2b6,6px 4px 0 #d0c5a7,9px 6px 0 #c4b89a,0 28px 50px rgba(0,0,0,.35);border-radius:3px 10px 10px 3px;left:50%}
.mobile .stack{left:0}
.stack.l{left:0;border-radius:10px 3px 3px 10px;box-shadow:-3px 2px 0 #ddd2b6,-6px 4px 0 #d0c5a7,-9px 6px 0 #c4b89a,0 28px 50px rgba(0,0,0,.35);transition:opacity .6s;opacity:0}
.book.open .stack.l{opacity:1}
.mobile .stack.l{display:none}

.leaf{position:absolute;top:0;left:50%;width:var(--W);height:var(--H);transform-origin:left center;transform-style:preserve-3d;transition:transform 1.25s cubic-bezier(.645,.045,.355,1),box-shadow .5s}
.mobile .leaf{left:0}
.leaf.flipped{transform:rotateY(-180deg)}
.leaf.turning{z-index:500 !important}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{border-radius:2px 10px 10px 2px}
.face.back{transform:rotateY(180deg);border-radius:10px 2px 2px 10px}
.face.front::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 7%,rgba(0,0,0,0) 94%,rgba(0,0,0,.06));z-index:50}
.face.back::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.22),rgba(0,0,0,0) 7%,rgba(0,0,0,0) 94%,rgba(0,0,0,.06));z-index:50}
.leaf.turning .face::before{content:'';position:absolute;inset:0;background:#000;z-index:60;pointer-events:none;animation:shade 1.25s ease-in-out}
@keyframes shade{0%,100%{opacity:0}50%{opacity:.28}}
.leaf:not([data-i="0"]) .face{cursor:pointer}

/* ============ PAGE BASICS ============ */
.page{position:absolute;inset:0;font-size:var(--u);color:#23324a;background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.8),transparent 45%),var(--paper)}
.mobile .page{overflow-y:auto;overflow-x:hidden}
.pad{position:relative;min-height:100%;padding:2.1em 2em 1.1em;display:flex;flex-direction:column;gap:.85em}
.page:not(.cover):not(.fin){}
.eyebrow{font-size:.72em;letter-spacing:.26em;color:var(--gold);font-weight:600}
h2{font-family:'Playfair Display',serif;font-size:1.75em;line-height:1.15;color:var(--navy);margin:0;font-weight:800}
h2 em{color:var(--gold);font-style:italic;font-weight:600}
.page p{margin:0;font-size:.86em;line-height:1.62;color:#44546a}
.lead{color:#5a6a80}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:.66em;letter-spacing:.12em;color:#a09680;border-top:1px solid #e6dcc3;padding-top:.6em}

/* entrance animations */
.a{opacity:0}
.on .a{opacity:1;animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.55s + var(--d,0s))}
@keyframes rise{from{opacity:0;transform:translateY(1.5em)}to{opacity:1;transform:none}}

/* ---------- cover ---------- */
.cover{background:linear-gradient(160deg,#0b2a4a 0%,#0d4a68 55%,#0e8f8c 135%);color:#fff;border-radius:2px 12px 12px 2px;transition:box-shadow .5s;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 60px rgba(0,0,0,.4)}
.cover::before{content:'';position:absolute;inset:.9em .9em .9em 1.5em;border:1px solid rgba(201,151,59,.7);border-radius:6px;pointer-events:none;z-index:2}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:.9em;background:linear-gradient(90deg,#06182c,#0b2a4a);z-index:3}
.cover::after{content:'';position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:shine 5s ease-in-out infinite;z-index:40;pointer-events:none}
@keyframes shine{0%{left:-40%}35%,100%{left:140%}}
.cover-in{position:relative;z-index:4;height:100%;padding:2.2em 2.1em 2em 2.5em;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5em}
.c-top{font-size:.62em;letter-spacing:.28em;color:#f1cf8b;font-weight:500}
.c-logo{margin-top:.5em}
.c-logo h1{font-family:'Playfair Display',serif;font-weight:800;font-size:3.3em;letter-spacing:.12em;margin:0;line-height:1;background:linear-gradient(180deg,#fff,#f0d596);-webkit-background-clip:text;background-clip:text;color:transparent}
.c-logo h3{margin:.3em 0 0;font-size:.95em;letter-spacing:.5em;color:#f1cf8b;font-weight:500}
.c-art{width:100%;margin:.4em 0;border-radius:.7em;overflow:hidden;flex:1;min-height:6em;max-height:15em;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.c-art svg{position:absolute;inset:0;width:100%;height:100%}
.c-tag{font-family:'Playfair Display',serif;font-style:italic;font-size:1.05em;line-height:1.35;color:#fff}
.c-est{font-size:.7em;letter-spacing:.3em;color:#f1cf8b;font-weight:600}
.c-dest{font-size:.72em;color:#cfe8ee}
.c-prof{margin-top:.2em;font-size:.72em;letter-spacing:.35em;font-weight:600;color:#0b2a4a;background:linear-gradient(90deg,#e8c36f,#c9973b);padding:.5em 1.2em;border-radius:30px}
.c-sub{font-size:.66em;color:#b8d6de;line-height:1.5;max-width:26em}
.openbadge{position:absolute;right:1.7em;bottom:1.6em;z-index:10;width:5.6em;height:5.6em;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe9a8,#e0a93f);color:#0b2a4a;font-weight:600;font-size:.75em;text-align:center;display:grid;place-items:center;line-height:1.25;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:pulse 1.8s ease-in-out infinite}
.openbadge::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,225,140,.8);animation:ring 1.8s ease-out infinite}
@keyframes pulse{50%{transform:scale(1.08) rotate(-4deg)}}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.5);opacity:0}}

/* ---------- about ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.stat{background:linear-gradient(160deg,var(--navy),#0d4a68);color:#fff;border-radius:.8em;padding:.7em .5em;text-align:center;transition:.3s}
.stat:hover{transform:translateY(-.3em) scale(1.04);box-shadow:0 10px 22px rgba(11,42,74,.35)}
.stat small{display:block;font-size:.56em;letter-spacing:.2em;color:#f1cf8b}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:1.7em;line-height:1.25}
.stat span{font-size:.6em;color:#bcd9e0}
.promise{border-left:3px solid var(--gold);background:#fff;padding:.7em .9em;border-radius:0 .6em .6em 0;font-size:.82em;line-height:1.55;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.promise b{display:block;font-size:.72em;letter-spacing:.22em;color:var(--gold);margin-bottom:.2em}
.mini-compass{position:absolute;right:1.4em;top:1.4em;width:3.6em;height:3.6em;opacity:.9}

/* ---------- destinations ---------- */
.dest{display:grid;grid-template-columns:38% 1fr;border-radius:.8em;overflow:hidden;background:#fff;border:1px solid #eadfc6;height:8.4em;transition:.35s;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.dest:hover{transform:translateY(-.3em);box-shadow:0 14px 28px rgba(11,42,74,.22);border-color:var(--gold)}
.ph{position:relative;overflow:hidden;background:#cde}
.ph img,.ph svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.ph img{z-index:2}
.dest:hover .ph img,.dest:hover .ph svg,.postcard:hover svg{transform:scale(1.14) rotate(.6deg)}
.ph::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);z-index:3}
.dest:hover .ph::after{left:140%;transition:left .9s}
.dest .tx{padding:.6em .8em;display:flex;flex-direction:column;justify-content:center;gap:.25em;min-width:0}
.dest h3{font-family:'Playfair Display',serif;margin:0;font-size:1.25em;color:var(--navy);letter-spacing:.08em}
.dest .sm{font-size:.7em;color:#6b7a8f;line-height:1.35}
.dest .gs{font-size:.54em;letter-spacing:.2em;color:var(--gold);font-weight:600;margin-top:.15em}
.chips{display:flex;flex-wrap:wrap;gap:.25em}
.chips span{font-size:.62em;background:#f3ead2;color:#6b5420;padding:.18em .6em;border-radius:20px}
.note{font-size:.72em;font-style:italic;color:#6b7a8f;text-align:center}

/* ---------- services ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.card{background:#fff;border:1px solid #eadfc6;border-radius:.7em;padding:.65em .7em;transition:.3s}
.card:hover{transform:translateY(-.25em) rotate(-.6deg);box-shadow:0 12px 24px rgba(11,42,74,.18);border-color:var(--gold)}
.card .ic{font-size:1.45em;display:inline-block}
.card:hover .ic{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-.35em) rotate(-10deg)}60%{transform:translateY(0) rotate(8deg)}}
.card h4{margin:.15em 0 .15em;font-size:.82em;color:var(--navy);font-weight:600;line-height:1.25}
.card p{font-size:.66em;line-height:1.45}

/* ---------- travel types ---------- */
.rows{display:flex;flex-direction:column;gap:.45em}
.row{display:grid;grid-template-columns:2em 8em 1fr;align-items:center;gap:.6em;padding:.5em .7em;border-radius:.6em;background:#fff;border:1px solid #eadfc6;transition:.3s}
.row:hover{transform:translateX(.4em);border-color:var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.1)}
.row .ic{font-size:1.4em;text-align:center}
.row b{font-size:.8em;color:var(--navy);font-weight:600}
.row span{font-size:.66em;color:#5a6a80;line-height:1.4}
.flex-box{background:linear-gradient(135deg,var(--navy),#0d6a7a);color:#fff;border-radius:.8em;padding:.7em .9em}
.flex-box b{font-size:.62em;letter-spacing:.22em;color:#f1cf8b;display:block;margin-bottom:.2em}
.flex-box span{font-size:.72em;line-height:1.5;color:#e2f1f4}

/* ---------- why ---------- */
.why{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.why .card .n{font-family:'Playfair Display',serif;font-size:1.5em;color:var(--gold);line-height:1}
.working{background:#fff;border:1px dashed var(--gold);border-radius:.7em;padding:.7em .9em;font-size:.76em;line-height:1.55;color:#44546a}
.working b{display:block;font-size:.76em;letter-spacing:.2em;color:var(--gold);margin-bottom:.2em}

/* ---------- how we work ---------- */
.steps{position:relative;display:flex;flex-direction:column;gap:.75em}
.steps::before{content:'';position:absolute;left:1.25em;top:1.2em;bottom:1.2em;width:2px;background:repeating-linear-gradient(180deg,var(--gold) 0 6px,transparent 6px 12px);animation:dash 1.2s linear infinite;background-size:2px 12px}
@keyframes dash{to{background-position:0 12px}}
.step{position:relative;display:grid;grid-template-columns:2.5em 1fr;gap:.8em;align-items:start;transition:.3s}
.step:hover{transform:translateX(.35em)}
.dot{width:2.5em;height:2.5em;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.85em;z-index:1;box-shadow:0 0 0 .3em #fbf6ea}
.step:hover .dot{background:var(--gold)}
.step h4{margin:.1em 0 .1em;font-size:.92em;color:var(--navy)}
.step p{font-size:.72em}
.tplane{position:absolute;left:.78em;top:0;width:1em;z-index:2;animation:down 5s ease-in-out infinite}
@keyframes down{0%{top:0}100%{top:92%}}
.tip{background:#fff;border-left:3px solid var(--teal);padding:.6em .8em;border-radius:0 .6em .6em 0;font-size:.7em;line-height:1.5;color:#44546a}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.cc{background:#fff;border:1px solid #eadfc6;border-radius:.7em;padding:.6em .75em;transition:.3s;font-size:.8em}
.cc:hover{transform:translateY(-.25em);border-color:var(--gold);box-shadow:0 10px 22px rgba(0,0,0,.12)}
.cc small{display:block;font-size:.62em;letter-spacing:.2em;color:var(--gold);font-weight:600;margin-bottom:.2em}
.cc div{font-size:.88em;color:var(--navy);line-height:1.4;word-break:break-word}
.cc.wide{grid-column:1/-1}
.btns{display:flex;gap:.5em;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-size:.78em;font-weight:600;padding:.6em 1.2em;border-radius:30px;transition:.3s;position:relative;overflow:hidden}
.btn.g{background:#25a35a;color:#fff}.btn.n{background:var(--navy);color:#fff}
.btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.25)}
.tagline{font-size:.62em;letter-spacing:.14em;color:var(--navy);font-weight:600;text-align:center}
.disc{font-size:.58em !important;line-height:1.45 !important;color:#8a8f99 !important}

/* ---------- final panel ---------- */
.fin{background:linear-gradient(170deg,#0b2a4a,#0d5a72 70%,#0e8f8c);color:#fff;border-radius:2px 12px 12px 2px}
.fin .pad{align-items:center;text-align:center;justify-content:center;gap:.7em}
.fin h2{color:#f1cf8b;font-size:2.2em;letter-spacing:.06em}
.fin .eyebrow{color:#cfe8ee}
.fin p{color:#d4e9ee}
.cards3{position:relative;width:100%;height:15em;margin:.6em 0}
.postcard{position:absolute;width:11em;height:7.6em;border:.35em solid #fff;border-radius:.3em;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,.4);transition:.45s;background:#fff}
.postcard svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .9s}
.postcard span{position:absolute;bottom:.2em;left:0;right:0;text-align:center;font-size:.7em;font-weight:600;letter-spacing:.3em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:5}
.pc1{left:2%;top:0;transform:rotate(-9deg)}
.pc2{left:50%;margin-left:-5.5em;top:4.3em;transform:rotate(3deg);z-index:2}
.pc3{right:2%;top:.5em;transform:rotate(9deg)}
.postcard:hover{transform:rotate(0) scale(1.14) translateY(-.5em);z-index:10}
.orbit{position:absolute;inset:0;pointer-events:none}

/* ============ CONTROLS ============ */
.controls{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:950}
.cbtn{border:0;background:rgba(11,42,74,.92);color:#fff;font-family:inherit;font-size:13px;font-weight:500;padding:10px 20px;border-radius:30px;cursor:pointer;transition:.25s;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cbtn:hover:not(:disabled){background:var(--gold);color:#0b2a4a;transform:translateY(-2px)}
.cbtn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px;background:rgba(255,255,255,.75);padding:9px 12px;border-radius:20px}
.dots i{width:9px;height:9px;border-radius:50%;background:#9bb3c4;cursor:pointer;transition:.3s}
.dots i.act{background:var(--gold);transform:scale(1.35)}
.controls.off{opacity:0;pointer-events:none}
.controls{transition:opacity .4s}

@media (max-width:820px){
  .brandbar span{display:none}
  .compass{display:none}
  .cbtn{padding:9px 14px}
  .hint{bottom:78px}
}
</style>
</head>
<body>

<!-- ============ BACKGROUND SCENE ============ -->
<div class="sky">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>

const book = document.getElementById('book');
const hint = document.getElementById('hint');
const controls = document.getElementById('controls');
const dotsEl = document.getElementById('dots');
let mobile = false, state = 0, maxState = 4, leaves = [];

function layout(){
  const vw = innerWidth, vh = innerHeight;
  const wasMobile = mobile;
  mobile = vw < 820;
  let W, H, u;
  if(mobile){
    W = Math.min(vw*0.94, 480);
    H = Math.max(420, Math.min(vh - 150, W*1.85));
    u = Math.max(12.5, W*0.037);
  } else {
    W = Math.min(vw*0.455, (vh-130)/1.38, 580);
    H = W*1.38;
    u = W*0.03;
  }
  const r = document.documentElement.style;
  r.setProperty('--W', W+'px'); r.setProperty('--H', H+'px'); r.setProperty('--u', u+'px');
  document.body.classList.toggle('mobile', mobile);
  return wasMobile !== mobile;
}

function build(){
  book.innerHTML = '<div class="stack l"></div><div class="stack"></div>';
  let list;
  if(mobile){ list = P.map(p=>({f:p,b:''})); }
  else { list = [0,1,2,3,4].map(i=>({f:P[2*i], b:P[2*i+1]||''})); }
  maxState = list.length-1;
  leaves = list.map((o,i)=>{
    const el = document.createElement('div');
    el.className='leaf'; el.dataset.i=i;
    el.innerHTML = `<div class="face front">${o.f}</div><div class="face back">${o.b || '<div class="page"></div>'}</div>`;
    book.appendChild(el);
    el.querySelectorAll('.a').forEach((n,k)=>n.style.setProperty('--d', (k*0.08)+'s'));
    return el;
  });
  dotsEl.innerHTML = list.map((_,i)=>`<i data-s="${i}"></i>`).join('');
  apply(true);
}

function apply(initial){
  leaves.forEach((el,i)=>{
    const flipped = i < state;
    const was = el.classList.contains('flipped');
    if(flipped !== was && !initial){
      el.classList.add('turning');
      setTimeout(()=>el.classList.remove('turning'),1300);
    }
    el.classList.toggle('flipped', flipped);
    el.style.zIndex = flipped ? (i+1) : (leaves.length - i);
  });
  book.classList.toggle('closed', state===0);
  book.classList.toggle('open', state>0);
  // which pages are visible -> animate their contents
  document.querySelectorAll('.page.on').forEach(p=>p.classList.remove('on'));
  const show = [];
  if(!mobile && state>0) show.push(leaves[state-1].querySelector('.back .page'));
  if(state<=maxState) show.push(leaves[state].querySelector('.front .page'));
  setTimeout(()=>show.forEach(p=>p&&p.classList.add('on')), initial?0:30);
  // controls
  controls.classList.toggle('off', state===0);
  hint.classList.toggle('hide', state>0);
  document.getElementById('prev').disabled = state===0;
  document.getElementById('next').disabled = state>=maxState;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('act', i===state));
}

function go(n){
  n = Math.max(0, Math.min(maxState, n));
  if(n===state) return;
  state = n; apply(false);
}

book.addEventListener('click', e=>{
  if(e.target.closest('a,button')) return;
  const leaf = e.target.closest('.leaf'); if(!leaf) return;
  const i = +leaf.dataset.i;
  if(i === state) go(state+1);
  else if(i === state-1) go(state-1);
});
document.getElementById('next').onclick = ()=>go(state+1);
document.getElementById('prev').onclick = ()=>go(state-1);
document.getElementById('close').onclick = ()=>go(0);
dotsEl.addEventListener('click', e=>{ const s=e.target.dataset.s; if(s!==undefined) go(+s); });
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') go(state+1);
  else if(e.key==='ArrowLeft') go(state-1);
  else if(e.key==='Escape') go(0);
});
let tx=0, ty=0;
addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.3){ dx<0 ? go(state+1) : go(state-1); }
},{passive:true});

let rt;
addEventListener('resize', ()=>{
  clearTimeout(rt);
  rt = setTimeout(()=>{ const changed = layout(); if(changed){ state=0; build(); } }, 120);
});

layout(); build();
</script>
</body>
</html>
